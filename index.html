
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Debonairs Pizza — Menu</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header">
    <img src="assets/debonairs-logo.png" alt="Debonairs Pizza logo" class="logo" />

    <nav>
      <a href="#">Home</a>
      <a href="#">Menu</a>
      <a href="#">Specials</a>
      <a href="#">Contact</a>
    </nav>

    <div class="header-buttons">
      <button class="login-btn">Sign In</button>
      <button class="order-btn">Order Now</button>
    </div>
  </header>

  <section class="promo-bar">
    <div>
      <h2>ON THE DOUBLE®</h2>
      <p>Double the flavour. Double the enjoyment!</p>
    </div>
    <button>ORDER & COLLECT</button>
  </section>

  <main class="menu-section">
    <h1>OUR PIZZA DEALS</h1>

    <div class="menu-grid">

      <article class="pizza-card">
        <img src="assets/pizza-1.png" alt="Pizza deal one" />
        <h2>THE DOUBLE DEAL</h2>
        <p>Two delicious pizzas to share.</p>
        <h3>R149.90</h3>
        <button>ORDER NOW</button>
      </article>

      <article class="pizza-card">
        <img src="assets/pizza-2.png" alt="Pizza deal two" />
        <h2>THE TRIPLE DEAL</h2>
        <p>More pizza, more happiness.</p>
        <h3>R199.90</h3>
        <button>ORDER NOW</button>
      </article>

      <article class="pizza-card">
        <img src="assets/pizza-3.png" alt="Pizza deal three" />
        <h2>THE FAMILY DEAL</h2>
        <p>A delicious feast for everyone.</p>
        <h3>R249.90</h3>
        <button>ORDER NOW</button>
      </article>

    </div>
  </main>

  <footer class="learner-footer">
    <span id="learner-signature">Your Name — YYYY-MM-DD</span>
  </footer>

  <script src="js/footer.js"></script>
</body>
</html>
